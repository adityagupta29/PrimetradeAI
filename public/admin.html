<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container wide">
        <div class="nav">
            <h3>Admin: <span id="username">Admin</span></h3>
            <button onclick="logout()" class="btn-secondary">Logout</button>
        </div>

        <h2 style="text-align:left; margin-bottom:20px;">System Overview</h2>

        <!-- Users Section -->
        <div style="background: white; padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 30px;">
            <h3 style="font-size: 1.1rem; margin-bottom: 15px; color: var(--text-main);">Registered Users</h3>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Role</th>
                    </tr>
                </thead>
                <tbody id="users-table-body">
                    <tr><td colspan="4">Loading...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Tasks Section -->
        <div style="background: white; padding: 20px; border-radius: 12px; border: 1px solid var(--border-color);">
            <h3 style="font-size: 1.1rem; margin-bottom: 15px; color: var(--text-main);">All System Tasks</h3>
            <div id="task-list" class="task-list">
                <p>Loading tasks...</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));

        if (!token || user.role !== 'admin') {
            alert("Access Denied");
            window.location.href = 'index.html';
        }
        document.getElementById('username').innerText = user.username;

        async function getUsers() {
            const res = await fetch(`${API_URL}/admin/users`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const users = await res.json();
            const tbody = document.getElementById('users-table-body');
            tbody.innerHTML = '';
            users.forEach(u => {
                const roleClass = u.role === 'admin' ? 'style="color:var(--primary); font-weight:600;"' : '';
                tbody.innerHTML += `
                    <tr>
                        <td>#${u.id}</td>
                        <td>${u.username}</td>
                        <td>${u.email}</td>
                        <td ${roleClass}>${u.role}</td>
                    </tr>
                `;
            });
        }

        async function getTasks() {
            const res = await fetch(`${API_URL}/tasks`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const tasks = await res.json();
            const list = document.getElementById('task-list');
            list.innerHTML = '';
            
            if (tasks.length === 0) {
                list.innerHTML = `<p style="text-align:center; color:var(--text-muted);">No tasks in system.</p>`;
                return;
            }

            tasks.forEach(task => {
                list.innerHTML += `
                    <div class="task-card">
                        <div class="task-info">
                            <h4>${task.title} <span class="task-tag">${task.status}</span></h4>
                            <p>Created by: <strong>${task.username}</strong></p>
                        </div>
                        <button onclick="deleteTask(${task.id})" class="btn-danger">Delete</button>
                    </div>
                `;
            });
        }

        async function deleteTask(id) {
            if(!confirm("Are you sure you want to delete this task?")) return;
            await fetch(`${API_URL}/tasks/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            getTasks();
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        getUsers();
        getTasks();
    </script>
</body>
</html>
